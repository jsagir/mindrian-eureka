</div><script>const tl=gsap.timeline({paused:true});
tl.fromTo("#ss01-host",{opacity:0},{opacity:1,duration:.45,ease:"power2.out"},0);
const dissolve=(outgoing,incoming,at,focus=false)=>{
  const blurOut=focus?"blur(22px)":"blur(0px)";
  const blurIn=focus?"blur(18px)":"blur(0px)";
  tl.to(outgoing,{opacity:0,filter:blurOut,scale:focus?1.035:1,duration:.55,ease:"power2.inOut"},at-.35);
  tl.fromTo(incoming,{opacity:0,filter:blurIn,scale:focus ? 0.97 : 1},{opacity:1,filter:"blur(0px)",scale:1,duration:.55,ease:"power2.inOut"},at-.25);
};
