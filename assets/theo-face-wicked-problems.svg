<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title description">
  <title id="title">Theo — Wicked Problems framework face</title>
  <desc id="description">Theo sits among shifting planes. Two yellow planes mark boundaries in tension; a dashed edge remains unknown. His angled slash stays open-ended as the context changes.</desc>
  <rect width="200" height="200" fill="#F7F5EE"/>
  <rect x="6" y="6" width="188" height="188" fill="#FFFFFF"/>
  <rect x="62" y="34" width="30" height="26" fill="#FFFFFF" stroke="#111111" stroke-width="3" stroke-dasharray="7 5"/>
  <rect x="99" y="87" width="37" height="37" fill="#F2C200" stroke="#111111" stroke-width="3"/>
  <rect x="136" y="36" width="44" height="26" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="85" y="89" width="33" height="37" fill="#F2C200" stroke="#111111" stroke-width="3"/>
  <rect x="122" y="38" width="40" height="26" fill="#FFFFFF" stroke="#111111" stroke-width="3"/>
  <rect x="24" y="58" width="12" height="84" fill="#111111" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(6 30 100)"/>
  <rect x="162" y="44" width="16" height="16" fill="#111111" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="92" y="144" width="16" height="16" fill="#111111" stroke="#FFFFFF" stroke-width="2.5"/>
  <rect x="3" y="3" width="194" height="194" fill="none" stroke="#111111" stroke-width="6"/>
</svg>
