<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 934" role="img" class="hub-figure"><title>The core of pair 1 of the unusual-pairs engine: two records, their words and what they share</title><desc>Record A: The Difficulties of Learning Logic Programs with Cut. Record B: Decidable Reasoning in Terminological Knowledge Representation Systems. Distinctive words of record A: logic, learning, program, claus, difficulty. Distinctive words of record B: terminological, knowledge, concept, alcnr, calculus. Meaning score 1.0133 and wording score 0.0391, on a scale from 0 to 1.2991. No distinctive word is shared. The link is in meaning only. Both engines list the pair and the second signal confirmed it. The cobalt block marks that. The words are a screening aid, not evidence. This does not show that the pair is new, wanted or valuable. It is a candidate, not verified.</desc><rect class="f-paper" x="0" y="0" width="1400" height="934" fill="#F7F5EE"/><rect class="f-frame" x="3" y="3" width="1394" height="928" fill="none" stroke="#111111" stroke-width="6"/><rect class="f-panel" x="50" y="100" width="520" height="570" fill="#FFFFFF" stroke="#111111" stroke-width="5"/><rect class="f-ink" x="50" y="100" width="520" height="22" fill="#111111"/><text class="f-mono f-soft" x="64" y="166" font-size="28" fill="#4B4943">RECORD A</text><text class="f-title" x="64" y="214" font-size="36" fill="#111111">The Difficulties of</text><text class="f-title" x="64" y="258" font-size="36" fill="#111111">Learning Logic</text><text class="f-title" x="64" y="302" font-size="36" fill="#111111">Programs with Cut</text><text class="f-mono f-soft" x="64" y="410" font-size="28" fill="#4B4943">DISTINCTIVE WORDS</text><rect class="f-chip" x="64" y="426" width="120" height="52" fill="#F7F5EE" stroke="#111111" stroke-width="3"/><text class="f-mono f-chip-t" x="79" y="462" font-size="28" fill="#111111">logic</text><rect class="f-chip" x="194" y="426" width="174" height="52" fill="#F7F5EE" stroke="#111111